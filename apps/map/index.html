<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Still There · Detroit potholes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
  <link rel="stylesheet" href="/apps/map/style.css">
</head>
<body>
  <!-- Top bar: name, what it is, the totals that matter, and whether the data is live.
       Numbers filled in by app.js. -->
  <!-- Top bar over the map only. The sidebar runs the full height on the right. -->
  <header class="bar">
    <div class="brand">Still There</div>
    <dl class="totals">
      <div><dd id="t-spots">0</dd><dt>spots</dt></div>
      <div><dd id="t-reports">0</dd><dt>city reports</dt></div>
      <div class="still"><dd id="t-still">0</dd><dt>still there</dt></div>
    </dl>
    <p class="source" id="source">Loading</p>
  </header>
  <main class="layout">
    <div id="map" aria-label="Map of pothole reports"></div>
    <!-- Sidebar. app.js fills it: a list of spots, or one spot when a pin is picked. -->
    <aside class="panel" id="panel">
      <p class="panel-sub">Loading spots</p>
    </aside>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
  <script src="/api/config"></script>
  <script src="/apps/map/agency.js"></script>
  <script src="/apps/map/app.js"></script>
</body>
</html>
