<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Still There · Detroit potholes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin>
  <link rel="stylesheet" href="/apps/map/style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">Still There</div>
    <div class="summary" id="summary">Loading city reports</div>
    <!-- One entry per pin color, with how many pins have it. Counts filled in by app.js. -->
    <ul class="legend" aria-label="Legend">
      <li><span class="dot still_there"></span>Still there<b id="n-still_there">0</b></li>
      <li><span class="dot unreported"></span>Not reported<b id="n-unreported">0</b></li>
      <li><span class="dot fixed_confirmed"></span>Fixed<b id="n-fixed_confirmed">0</b></li>
      <li><span class="dot reported_only"></span>Not checked yet<b id="n-reported_only">0</b></li>
    </ul>
  </header>
  <main class="layout">
    <div id="map" aria-label="Map of pothole reports"></div>
    <!-- Sidebar. app.js fills it: a list of spots, or one spot when a pin is picked. -->
    <aside class="panel" id="panel">
      <p class="panel-sub">Loading spots</p>
    </aside>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
  <script src="/api/config"></script>
  <script src="/apps/map/agency.js"></script>
  <script src="/apps/map/app.js"></script>
</body>
</html>
