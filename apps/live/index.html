<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f10">
  <title>Still There? Live</title>
  <!-- All paths start with /apps/live/ because Vercel serves this page at /live,
       where a relative path like "app.js" would point to the wrong place. -->
  <!-- Geist: a crisp font made for screens. Geist Mono for numbers. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/apps/live/style.css">
  <!-- ONNX Runtime Web (runs the model) is added by detector.js once it knows which
       engine to use. Version: ORT_VERSION in config.js. -->
  <script type="module" src="/apps/live/app.js"></script>
</head>
<body>
  <main>
    <!-- The camera feed, shown as is so the phone can draw it smoothly. -->
    <video id="camera" playsinline muted></video>

    <!-- A clear layer on top of the camera with only the boxes. Same size and fit as
         the video, so the boxes line up with the picture. -->
    <canvas id="view" aria-label="Detected potholes"></canvas>

    <!-- Shown on top of the camera picture while the model loads: one line of text and
         a yellow bar that fills as it goes. Also used for errors. -->
    <div id="banner" role="status" hidden>
      <p id="banner-text"></p>
      <div class="progress" id="banner-progress"><span id="banner-bar"></span></div>
    </div>

    <!-- Shown until the camera starts. Browsers need a tap before using the camera. -->
    <section id="start-screen">
      <h1 class="brand">Still There</h1>
      <p>Point your camera at the road. Potholes get a box and go on the map</p>

      <!-- Which pothole model to load. Filled in by app.js from MODELS in config.js. -->
      <div id="model-picker" class="picker" role="group" aria-label="Model"></div>

      <button id="start" type="button">Start camera</button>
      <p id="status" role="status"></p>

      <!-- GPS track from a drive that did not end cleanly (page closed, crash). -->
      <button id="leftover" type="button" class="link" hidden></button>
    </section>

    <!-- Drive recording (recorder.js): big red dot and time, top right, easy to see
         from the driver's seat. -->
    <div id="rec" role="status" hidden>
      <span class="rec-dot" aria-hidden="true"></span>
      <b id="rec-time">0:00</b>
      <small>Keep this page open</small>
    </div>

    <!-- Status box. Top: which model and whether it sends. Middle: what matters while
         filming. Bottom: last result and three icon buttons. -->
    <aside id="stats" hidden>
      <header class="stats-head">
        <span class="mark" aria-hidden="true"></span>
        <b id="stat-model">-</b>
        <span id="stat-mode"></span>
      </header>
      <dl class="stats-rows">
        <div data-detect><dt>In view</dt><dd id="stat-count">-</dd></div>
        <div><dt>GPS</dt><dd id="stat-gps">-</dd></div>
        <div data-detect><dt>Sent to map</dt><dd id="stat-sent">0</dd></div>
        <div data-rec hidden><dt>GPS fixes</dt><dd id="stat-fixes">0</dd></div>
        <div data-rec hidden><dt>Clips</dt><dd id="stat-clips">0</dd></div>
      </dl>
      <p id="stat-message" hidden></p>
      <div class="actions">
        <!-- Icons from Lucide (lucide.dev, ISC license): "video", "switch-camera", "cpu", "layers". -->
        <button id="record" type="button" class="icon" aria-pressed="false" aria-label="Record drive" title="Record drive">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
        </button>
        <button id="switch-camera" type="button" class="icon" aria-label="Flip camera" title="Flip camera">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/><path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/><circle cx="12" cy="12" r="3"/><path d="m18 22-3-3 3-3"/><path d="m6 2 3 3-3 3"/></svg>
        </button>
        <button id="switch-model" type="button" class="icon" data-detect aria-label="Switch model" title="Switch model">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg>
        </button>
        <button id="switch-backend" type="button" class="icon" data-detect aria-label="Switch engine" title="Switch engine">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>
        </button>
      </div>
      <!-- Files from the drive. They also download on their own; Save is the backup
           when the phone blocks that. -->
      <details id="files" hidden>
        <summary>Files <span id="files-count"></span></summary>
        <ul id="files-list"></ul>
      </details>
    </aside>
  </main>

  <!-- Safety check. If app.js fails to load (old browser, bad network), the Start
       button would do nothing. This plain script still runs and says so. -->
  <script>
    window.addEventListener("error", function (e) {
      if (window.liveReady) return;
      document.getElementById("status").textContent = "Error: " + e.message;
    });
    document.getElementById("start").addEventListener("click", function () {
      if (window.liveReady) return;
      document.getElementById("status").textContent =
        "The page script did not load. Check your connection and reload the page.";
    });
  </script>
</body>
</html>
