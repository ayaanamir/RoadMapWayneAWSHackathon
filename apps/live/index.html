<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Still There? Live</title>
  <!-- All paths start with /apps/live/ because Vercel serves this page at /live,
       where a relative path like "app.js" would point to the wrong place. -->
  <link rel="stylesheet" href="/apps/live/style.css">
  <!-- ONNX Runtime Web (runs the model) is added by detector.js once it knows which
       engine to use. Version: ORT_VERSION in config.js. -->
  <script type="module" src="/apps/live/app.js"></script>
</head>
<body>
  <main>
    <!-- The camera image and boxes are both drawn on this one canvas, so the boxes
         always line up with the picture. -->
    <canvas id="view" aria-label="Camera view with detected objects"></canvas>

    <!-- The camera feed. Invisible: we copy its frames onto the canvas above. -->
    <video id="camera" playsinline muted></video>

    <!-- Messages shown on top of the camera picture while the model loads. -->
    <p id="banner" role="status" hidden></p>

    <!-- Shown until the camera starts. Browsers need a tap before using the camera. -->
    <section id="start-screen">
      <h1>Still There?</h1>
      <p>Point your camera at the road. Potholes get a box.</p>
      <button id="start" type="button">Start camera</button>
      <p id="status" role="status">Ready.</p>
    </section>

    <!-- Speed numbers, so we can compare phones and browsers. -->
    <aside id="stats" hidden>
      <div><span>Model</span><b id="stat-model">-</b></div>
      <div><span>Engine</span><b id="stat-backend">-</b></div>
      <div><span>Model ms</span><b id="stat-ms">-</b></div>
      <div><span>Checks/s</span><b id="stat-fps">-</b></div>
      <div><span>Found</span><b id="stat-count">-</b></div>
      <div><span>GPS</span><b id="stat-gps">-</b></div>
      <div><span>Sent</span><b id="stat-sent">0</b></div>
      <p id="stat-message" hidden></p>
      <div class="actions">
        <button id="switch-backend" type="button">Switch engine</button>
        <button id="switch-camera" type="button">Flip camera</button>
      </div>
    </aside>
  </main>

  <!-- Safety check. If app.js fails to load (old browser, bad network), the Start
       button would do nothing. This plain script still runs and says so. -->
  <script>
    window.addEventListener("error", function (e) {
      if (window.liveReady) return;
      document.getElementById("status").textContent = "Error: " + e.message;
    });
    document.getElementById("start").addEventListener("click", function () {
      if (window.liveReady) return;
      document.getElementById("status").textContent =
        "The page script did not load. Check your connection and reload the page.";
    });
  </script>
</body>
</html>
