<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f10">
  <title>Drive Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <style>
    :root {
      --bg: #0f0f10; --card: #19191b; --line: #2a2a2d; --ink: #ededee; --mute: #a1a1a6;
      --pothole: #e5533a; --patch: #f2c230; --shadow: #77777c; --unv: #5b8def; --prev: #cfcfd2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Geist, -apple-system, sans-serif; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 64px; }
    .k { color: var(--mute); font-size: 13px; }
    h1 { font-size: 28px; line-height: 1.15; margin: 4px 0 0; letter-spacing: -0.01em; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line);
      border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 18px 0 8px; }
    @media (min-width: 640px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .stat { background: var(--card); padding: 12px 14px; }
    .stat b { display: block; font: 600 22px Geist Mono, ui-monospace, monospace; }
    .stat span { color: var(--mute); font-size: 13px; }
    .breakdown { color: var(--mute); font-size: 14px; margin: 8px 0 16px; }
    #map { height: 340px; border-radius: 10px; border: 1px solid var(--line); background: #222; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--mute); margin: 8px 0 24px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
    h2 { font-size: 17px; margin: 0 0 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
    @media (min-width: 640px) { .card { display: grid; grid-template-columns: 320px 1fr; gap: 14px; } }
    .ph { position: relative; }
    .ph img { width: 100%; display: block; border-radius: 6px; }
    .ph .box { position: absolute; border: 2px solid var(--patch); border-radius: 2px; }
    .body { padding: 8px 2px 2px; }
    .top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
    .num { font-weight: 700; }
    .verdict { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; color: #111; }
    .v-pothole { background: var(--pothole); color: #fff; } .v-patch { background: var(--patch); }
    .v-shadow { background: var(--shadow); color: #fff; } .v-unverified { background: var(--unv); color: #fff; }
    .meta { color: var(--mute); font: 12px Geist Mono, ui-monospace, monospace; }
    .prev, .new { margin: 8px 0 0; font-size: 14px; } .new { color: var(--mute); }
    .to { margin: 6px 0 0; font-size: 14px; } .to span { color: var(--mute); }
    a { color: var(--unv); }
    .empty { color: var(--mute); }
    .bar { display: flex; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
    .bar a, .bar button { font: inherit; font-size: 14px; color: var(--ink); background: var(--card); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 12px; text-decoration: none; cursor: pointer; }
    .filters { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
    .filters button { font: inherit; font-size: 13px; color: var(--mute); background: none; border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; }
    .filters button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="k" id="when">Drive report</div>
    <h1 id="headline">Loading…</h1>
    <div class="stats" id="stats"></div>
    <p class="breakdown" id="breakdown"></p>
    <div id="map"></div>
    <div class="legend">
      <span><i style="background:var(--pothole)"></i>Pothole</span>
      <span><i style="background:var(--patch)"></i>Patched</span>
      <span><i style="background:var(--shadow)"></i>Not a pothole</span>
      <span><i style="background:var(--unv)"></i>Not checked</span>
      <span><i style="border:2px solid var(--prev)"></i>Earlier city report</span>
    </div>
    <h2>Sightings</h2>
    <div class="filters" id="filters">
      <button type="button" data-f="real" aria-pressed="true">Potholes &amp; patches</button>
      <button type="button" data-f="all" aria-pressed="false">Everything the model saw</button>
    </div>
    <div id="cards"></div>
    <div class="bar">
      <a href="/live">Back to camera</a>
      <a href="/">Open the city map</a>
      <button type="button" id="new-drive">Start a new drive</button>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="/apps/live/drivereport.js"></script>
</body>
</html>
